services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    # Comparte la red con db: Postgres queda en localhost:5432, igual que fuera del contenedor.
    network_mode: service:db
    # Los comandos de arranque migran la base: esperar a que acepte conexiones.
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: atencion
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d atencion"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
