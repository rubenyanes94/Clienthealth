[project]
name = "atencion-pacientes-api"
version = "0.1.0"
description = "API de la consola de atención al paciente — Centro Médico San Bernardino"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "email-validator>=2.2",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
# Corre en cada build de Vercel después de instalar dependencias (ver docs/INFRAESTRUCTURA.md §4).
build = "python -m alembic upgrade head"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DTZ"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
